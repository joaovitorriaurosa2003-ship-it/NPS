<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sensação · Pesquisa de Satisfação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B3D6D;
    --ink-2:#0F4F8C;
    --ink-deep:#052240;
    --sun:#FFE600;
    --amber:#FFB020;
    --amber-deep:#F09000;
    --paper:#FBF7EC;
    --card:#FFFFFF;
    --text:#132135;
    --muted:#63758C;
    --line:#E9E2CF;
    --danger:#D6455A;
    --danger-bg:#FDEEEF;
    --success:#1E9E63;
    --success-bg:#E7F8EE;
    --r-lg:26px;
    --r-md:18px;
    --r-sm:13px;
    --shadow-soft:0 14px 34px rgba(11,61,109,0.10);
    --shadow-deep:0 24px 60px rgba(3,20,40,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--paper);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto;}
  button{font-family:inherit;cursor:pointer;}
  a{color:var(--ink);}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  ::selection{background:var(--sun);color:var(--ink-deep);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }

  /* ---------- Decorative watermark logo / blobs ---------- */
  .bg-decor{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .bg-decor .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;}
  .bg-decor .blob-1{width:420px;height:420px;background:radial-gradient(circle,var(--sun),transparent 70%);top:-160px;left:-120px;animation:drift1 26s ease-in-out infinite;}
  .bg-decor .blob-2{width:380px;height:380px;background:radial-gradient(circle,var(--amber),transparent 70%);bottom:-180px;right:-100px;animation:drift2 32s ease-in-out infinite;}
  .bg-decor .blob-3{width:260px;height:260px;background:radial-gradient(circle,var(--ink-2),transparent 72%);top:40%;right:8%;opacity:.3;animation:drift1 22s ease-in-out infinite reverse;}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,30px) scale(1.08);}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,-40px) scale(1.05);}}
  .bg-decor .logo-watermark{
    position:fixed;left:50%;bottom:3%;width:min(860px,90vw);z-index:0;
    transform:translate(-50%,0) rotate(-2deg);
    opacity:.5;
    transition:transform .45s cubic-bezier(.22,.9,.32,1);
    will-change:transform;
  }
  /* Variante usada na pós-venda: a logo fica fixa no meio vertical da tela
     em vez de perto do rodapé. */
  .bg-decor .logo-watermark.wm-mid{
    top:50%;bottom:auto;
    transform:translate(-50%,-50%) rotate(-2deg);
  }
  /* Em páginas longas (pós-venda), reserva um respiro depois do card para
     que, quando a marca d'água fixa aparecer ali embaixo (acompanhando a
     rolagem, igual nas outras telas), o botão "Enviar respostas" já tenha
     rolado para fora da zona onde ela fica — nunca colidem. */
  .pv-wm-spacer{height:46vh;}

  /* ---------- Top bar (admin) ---------- */
  .topbar-shell{background:linear-gradient(150deg,var(--ink-deep) 0%,var(--ink) 55%,var(--ink-2) 100%);position:relative;overflow:hidden;}
  .topbar{
    position:relative;z-index:1;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px 14px;
    max-width:1120px;margin:0 auto;width:100%;
  }
  .topbar-left{display:flex;align-items:center;gap:14px;}
  .brand-chip{background:#fff;border-radius:14px;padding:6px 12px;display:inline-flex;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,0.18);}
  .topbar-logo{height:26px;display:block;}
  .topbar-title{font-family:'Fraunces',serif;font-weight:600;font-size:17px;letter-spacing:.2px;color:#fff;}
  .topbar-title small{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:11.5px;opacity:.72;margin-top:1px;letter-spacing:.2px;}
  .btn-logout{
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.22);
    color:#fff;
    padding:9px 16px;border-radius:999px;
    font-size:13px;font-weight:600;
    transition:background .15s, transform .15s;
  }
  .btn-logout:hover{background:rgba(255,255,255,0.2);transform:translateY(-1px);}

  .nav-tabs{
    position:relative;z-index:1;
    display:flex;gap:4px;
    max-width:1120px;margin:0 auto;width:100%;
    padding:0 24px 18px;
    overflow-x:auto;
  }
  .nav-tab{
    padding:9px 18px;border-radius:999px;
    color:rgba(255,255,255,0.68);
    font-size:13.5px;font-weight:600;
    text-decoration:none;white-space:nowrap;
    transition:background .15s,color .15s,transform .15s;
  }
  .nav-tab:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .nav-tab.active{
    background:linear-gradient(120deg,var(--sun),var(--amber));
    color:var(--ink-deep);
    box-shadow:0 6px 18px rgba(255,176,32,0.35);
  }

  .admin-wrap{max-width:1120px;margin:0 auto;padding:32px 20px 64px;width:100%;animation:riseIn .5s ease both;}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Cards / generic ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r-md);
    padding:22px;
    box-shadow:var(--shadow-soft);
  }
  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:26px;}
  .stat-box{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r-md);
    padding:20px 20px 18px;
    box-shadow:var(--shadow-soft);
    overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .stat-box::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--sun),var(--amber));}
  .stat-box:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(11,61,109,0.14);}
  .stat-box .num{font-family:'Fraunces',serif;font-size:30px;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .stat-box .label{font-size:12px;color:var(--muted);margin-top:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;background:#F6F1E3;}
  tr:hover td{background:#FCF9F0;}
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-soft);}
  .table-scroll table{border:none;}
  .table-scroll .card{border:none;padding:0;box-shadow:none;}

  .section-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:36px 0 14px;color:var(--ink);}
  .section-title:first-of-type{margin-top:0;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--ink);color:#fff;border:none;
    padding:12px 22px;border-radius:999px;font-weight:600;font-size:14px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow:0 8px 20px rgba(11,61,109,0.22);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(11,61,109,0.3);}
  .btn:active{transform:translateY(0);}
  .btn.secondary{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;}
  .btn.secondary:hover{background:#F6F1E3;border-color:var(--ink-2);}
  .btn.gold{background:linear-gradient(120deg,var(--sun),var(--amber));color:var(--ink-deep);box-shadow:0 10px 24px rgba(255,176,32,0.35);}
  .btn.gold:hover{filter:brightness(1.03);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}

  select,input[type=text],input[type=email],input[type=password]{
    padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);
    font-size:14px;font-family:inherit;width:100%;background:#fff;color:var(--text);
    transition:border-color .15s, box-shadow .15s;
  }
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,176,32,0.18);}
  label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:7px;}
  .field{margin-bottom:18px;}
  .error-msg{background:var(--danger-bg);color:var(--danger);border:1px solid #F5CBD1;padding:11px 15px;border-radius:var(--r-sm);font-size:13.5px;margin-bottom:16px;}

  /* ---------- Login ---------- */
  .login-wrap{
    flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 20% 0%,var(--ink-2) 0%,var(--ink) 45%,var(--ink-deep) 100%);
    padding:24px;overflow:hidden;
  }
  .login-card{
    position:relative;z-index:1;
    background:rgba(255,255,255,0.98);border-radius:var(--r-lg);
    padding:40px 34px 34px;width:100%;max-width:380px;
    box-shadow:var(--shadow-deep);
    animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .login-card h2{text-align:center;font-size:20px;color:var(--ink);margin:0 0 26px;font-weight:600;}

  /* ---------- Public survey ---------- */
  .survey-wrap{
    flex:1;position:relative;display:flex;flex-direction:column;align-items:center;
    padding:40px 18px 54px;
    background:radial-gradient(130% 90% at 50% -10%,var(--ink-2) 0%,var(--ink) 42%,var(--ink-deep) 100%);
    overflow:hidden;
  }
  .survey-header{position:relative;z-index:1;text-align:center;margin-bottom:28px;}
  .survey-header h1{font-size:26px;color:#fff;margin:0 0 8px;font-weight:600;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,0.3);}
  .survey-header p{color:rgba(255,255,255,0.72);font-size:14.5px;margin:0;}
  .survey-card{
    position:relative;z-index:1;
    background:#fff;border-radius:var(--r-lg);padding:32px 28px;width:100%;max-width:540px;
    box-shadow:var(--shadow-deep);
    animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:.05s;
  }
  .conn-banner:not(:empty){
    background:#FFF7DA;border:1px solid #F3D98A;color:#7A5B00;
    padding:10px 15px;border-radius:var(--r-sm);font-size:13px;text-align:center;margin-bottom:16px;
  }

  /* NPS emoji likert */
  .likert{display:flex;justify-content:space-between;gap:9px;margin:22px 0 12px;}
  .likert-opt{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:16px 4px;border-radius:20px;border:2px solid var(--line);background:#fff;
    transition:transform .18s cubic-bezier(.3,1.4,.5,1), border-color .15s, background .15s, box-shadow .15s;
  }
  .likert-opt .emoji{font-size:30px;line-height:1;transition:transform .18s;}
  .likert-opt .txt{font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.25;}
  .likert-opt:hover{border-color:var(--amber);transform:translateY(-2px);}
  .likert-opt.selected{
    border-color:transparent;
    background:linear-gradient(160deg,#FFF7D6,#FFE9BC);
    box-shadow:0 10px 22px rgba(255,176,32,0.28);
    transform:translateY(-3px) scale(1.04);
  }
  .likert-opt.selected .emoji{transform:scale(1.12);}
  .likert-opt.selected .txt{color:var(--ink);}
  textarea{
    width:100%;min-height:92px;padding:13px;border:1.5px solid var(--line);border-radius:var(--r-sm);
    font-family:inherit;font-size:14px;resize:vertical;color:var(--text);
    transition:border-color .15s, box-shadow .15s;
  }
  textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,176,32,0.18);}

  /* pós-venda question blocks */
  .pv-question{margin-bottom:28px;}
  .pv-question .q-num{font-size:11px;font-weight:700;color:var(--ink-deep);background:linear-gradient(120deg,var(--sun),var(--amber));
    display:inline-block;padding:3px 10px;border-radius:999px;margin-bottom:9px;letter-spacing:.2px;}
  .pv-question .q-text{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.35;}
  .pv-question .q-helper{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
  .stars{display:flex;justify-content:space-between;gap:4px;}
  .star-btn{
    flex:1;background:none;border:none;font-size:34px;line-height:1;color:#E3DCC6;padding:2px;
    transition:color .12s, transform .15s cubic-bezier(.3,1.4,.5,1);
  }
  .star-btn:hover{transform:scale(1.12);}
  .star-btn.filled{color:var(--amber);}
  .star-label{font-size:12px;color:var(--muted);margin-top:6px;font-weight:500;}
  .choice-list{display:flex;flex-direction:column;gap:9px;}
  .choice-opt{
    padding:13px 16px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;
    background:#fff;text-align:left;color:var(--text);
    transition:border-color .15s, background .15s, transform .15s;
  }
  .choice-opt:hover{border-color:var(--amber);transform:translateX(2px);}
  .choice-opt.selected{
    border-color:transparent;
    background:linear-gradient(120deg,#FFF7D6,#FFE9BC);
    color:var(--ink);font-weight:700;
    box-shadow:0 8px 18px rgba(255,176,32,0.22);
  }
  .nps-scale{display:flex;flex-wrap:nowrap;justify-content:space-between;gap:3px;}
  .nps-btn{
    flex:1 1 0;width:auto;min-width:0;aspect-ratio:1;max-width:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
    font-size:12px;font-weight:700;color:var(--text);padding:0;
    transition:transform .15s cubic-bezier(.3,1.4,.5,1), background .15s, border-color .15s, color .15s;
  }
  .nps-btn:hover{transform:scale(1.1);border-color:var(--amber);}
  .nps-btn.selected{
    background:linear-gradient(140deg,var(--ink-2),var(--ink));
    border-color:var(--ink);color:#fff;transform:scale(1.08);
  }
  .nps-scale-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;}

  .submit-bar{margin-top:26px;}
  .submit-bar .btn{width:100%;justify-content:center;padding:14px;font-size:15.5px;}

  /* thank you screen */
  .thanks-wrap{
    flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:44px 20px;text-align:center;
    background:radial-gradient(130% 90% at 50% -10%,var(--ink-2) 0%,var(--ink) 42%,var(--ink-deep) 100%);
    overflow:hidden;
  }
  .thanks-card{position:relative;z-index:1;background:#fff;border-radius:var(--r-lg);padding:44px 34px;max-width:420px;width:100%;box-shadow:var(--shadow-deep);animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both;}
  .check-wrap{width:84px;height:84px;margin:0 auto 20px;}
  .check-wrap svg{width:100%;height:100%;}
  .check-circle{fill:none;stroke:var(--success);stroke-width:4;stroke-dasharray:220;stroke-dashoffset:220;animation:drawCircle .6s ease forwards;}
  .check-mark{fill:none;stroke:var(--success);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:drawCheck .35s ease forwards .5s;}
  @keyframes drawCircle{to{stroke-dashoffset:0;}}
  @keyframes drawCheck{to{stroke-dashoffset:0;}}
  .thanks-card h2{color:var(--ink);font-size:22px;margin:0 0 10px;font-weight:600;}
  .thanks-card p{color:var(--muted);font-size:14.5px;max-width:340px;margin:0 auto;}
  .thanks-card .countdown{margin-top:24px;font-size:12.5px;color:var(--muted);}

  .empty-state{text-align:center;padding:44px 20px;color:var(--muted);}

  @media (max-width:480px){
    .likert-opt .txt{display:none;}
    .stat-box .num{font-size:25px;}
    .admin-wrap{padding:22px 14px 54px;}
    .survey-card{padding:26px 20px;}
    .survey-header h1{font-size:22px;}
  }
</style>
</head>
<body>
<div id="app"></div>

/* ======================================================================
   ROUTER
   ====================================================================== */
let currentUser = null;
let authReady = false;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  authReady = true;
  render();
});

window.addEventListener("hashchange", () => {
  window.scrollTo(0, 0);
  render();
  if (typeof updateWatermarkParallax === "function") updateWatermarkParallax();
});

function getHash(){
  return window.location.hash || "#/pesquisa";
}

function navigate(hash){
  window.location.hash = hash;
}

function render(){
  if (!authReady) return;
  const hash = getHash();
  const app = document.getElementById("app");

  if (hash.startsWith("#/admin")) {
    if (!currentUser) { renderLogin(app); return; }
    if (hash === "#/admin" || hash === "#/admin/nps") { renderAdminResults(app, "nps"); return; }
    if (hash === "#/admin/pos-venda") { renderAdminResults(app, "posvenda"); return; }
    if (hash === "#/admin/exportar") { renderExportar(app); return; }
    renderAdminResults(app, "nps");
    return;
  }

  if (hash === "#/login") { renderLogin(app); return; }
  if (hash === "#/pos-venda") { renderPosVendaSurvey(app); return; }
  // default: pesquisa NPS simples
  renderNpsSurvey(app);

  stopReturnTimer(); // public pages manage their own timer per render
}

function fmtDate(ts){
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function splitDateTime(ts){
  if (!ts) return { data:"", hora:"" };
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return { data:d.toLocaleDateString("pt-BR"), hora:d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) };
}
function topbarHtml(activeTab){
  return `
    <div class="topbar-shell">

function renderLogin(app){
  app.innerHTML = `
    <div class="login-wrap">
      ${bgDecorHtml()}
      <div class="login-card">
        <h2>Painel administrativo</h2>
        <div id="loginError"></div>
        <form id="loginForm">
          <div class="field">
            <label>E-mail</label>
            <input type="email" id="loginEmail" required autocomplete="username">
          </div>
          <div class="field">
            <label>Senha</label>
            <input type="password" id="loginPassword" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn gold" style="width:100%;justify-content:center;padding:13px;">Entrar</button>
        </form>
      </div>
    </div>
  `;
  document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errBox = document.getElementById("loginError");
    errBox.innerHTML = "";
    try {
      await signInWithEmailAndPassword(auth, email, password);
      navigate("#/admin/nps");
    } catch (err) {
      const map = {
        "auth/invalid-credential": "E-mail ou senha incorretos.",
        "auth/user-not-found": "Usuário não encontrado.",
        "auth/wrong-password": "Senha incorreta.",
        "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco e tente de novo.",
        "auth/unauthorized-domain": "Este domínio não está autorizado no Firebase (Authentication → Settings → Authorized domains).",
        "auth/invalid-email": "E-mail inválido.",
        "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "A chave do Firebase (apiKey) no arquivo está incorreta ou é o placeholder — confira o firebaseConfig."
      };
      errBox.innerHTML = `<div class="error-msg">${map[err.code] || ("Erro ao entrar: " + err.code)}</div>`;
    }
  };
}

const NPS_OPTIONS = [
  { score:1, emoji:"😡", txt:"Muito insatisfeito" },
  { score:2, emoji:"😕", txt:"Insatisfeito" },
  { score:3, emoji:"😐", txt:"Neutro" },
  { score:4, emoji:"🙂", txt:"Satisfeito" },
  { score:5, emoji:"😍", txt:"Muito satisfeito" }
];

function renderNpsSurvey(app){
  let selected = null;
  app.innerHTML = `
    <div class="survey-wrap">
      ${bgDecorHtml()}
      <div class="survey-header">
        <h1>Como foi sua experiência hoje?</h1>
        <p>Sua opinião ajuda a gente a melhorar cada vez mais.</p>
      </div>
      <div class="survey-card">
        <div class="conn-banner" id="connBanner"></div>
        <div class="likert" id="likertRow">
          ${NPS_OPTIONS.map(o => `
            <button type="button" class="likert-opt" data-score="${o.score}">
              <span class="emoji">${o.emoji}</span>
              <span class="txt">${o.txt}</span>
            </button>
          `).join("")}
        </div>
        <div class="field" style="margin-top:16px;">
          <label>Quer contar mais alguma coisa? (opcional)</label>
          <textarea id="obsField" placeholder="Escreva aqui..."></textarea>
        </div>
        <div class="submit-bar">
          <button class="btn gold" id="btnSubmit" disabled>Enviar avaliação</button>
        </div>
      </div>
    </div>
  `;
  document.querySelectorAll(".likert-opt").forEach(btn => {
    btn.onclick = () => {
      selected = parseInt(btn.dataset.score, 10);
      document.querySelectorAll(".likert-opt").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      document.getElementById("btnSubmit").disabled = false;
    };
  });
  document.getElementById("btnSubmit").onclick = async () => {
    const btn = document.getElementById("btnSubmit");
    btn.disabled = true;
    btn.textContent = "Enviando...";
    try {
      await addDoc(collection(db, "responses"), {
        score: selected,
        observation: document.getElementById("obsField").value.trim(),
        createdAt: serverTimestamp()
      });
      renderThanks(app, "#/pesquisa");
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Enviar avaliação";
      alert("Não foi possível enviar. Verifique a conexão e tente de novo.");
    }
  };
  keepScreenAwake();
}

          ${[1,2,3,4,5].map(n => `<button type="button" class="star-btn" data-val="${n}">★</button>`).join("")}
        </div>
        ${q.starLabels ? `<div class="star-label" id="starLabel-${q.id}"></div>` : ""}
      `;
    } else if (q.type === "choice") {
      body = `
        <div class="choice-list" data-qid="${q.id}">
          ${q.options.map(opt => `<button type="button" class="choice-opt" data-val="${opt}">${opt}</button>`).join("")}
        </div>
      `;
    } else if (q.type === "nps") {
      body = `
        <div class="nps-scale" data-qid="${q.id}">
          ${Array.from({length:11}, (_,n) => `<button type="button" class="nps-btn" data-val="${n}">${n}</button>`).join("")}
        </div>
        <div class="nps-scale-labels"><span>Nada provável</span><span>Certamente indicaria</span></div>
      `;
    } else if (q.type === "text") {
      body = `<textarea data-qid="${q.id}" placeholder="Escreva aqui... (opcional)"></textarea>`;
    }
    return `
      <div class="pv-question">
        <span class="q-num">Pergunta ${idx+1} de ${POSVENDA_QUESTIONS.length}${q.required ? "" : " · opcional"}</span>
        <div class="q-text">${q.text}</div>
        ${q.helper ? `<div class="q-helper">${q.helper}</div>` : ""}
        ${body}
      </div>
    `;
  }

  app.innerHTML = `
    <div class="survey-wrap pv-wrap">
      ${bgDecorHtml(true, true)}
      <div class="survey-header">
        <h1>Pesquisa de pós-venda</h1>
        <p>Leva menos de 1 minuto. Obrigado por ajudar a ${EMPRESA_NOME} a melhorar!</p>
      </div>
      <div class="survey-card">
        <div class="conn-banner" id="connBanner"></div>
        <form id="pvForm">
          ${POSVENDA_QUESTIONS.map(questionHtml).join("")}
          <div class="submit-bar">
            <button type="submit" class="btn gold" id="btnPvSubmit">Enviar respostas</button>
          </div>
        </form>
      </div>
      <div class="pv-wm-spacer" aria-hidden="true"></div>
    </div>
  `;

  // stars
  document.querySelectorAll(".stars").forEach(group => {
    const qid = group.dataset.qid;
    const q = POSVENDA_QUESTIONS.find(x => x.id === qid);
    group.querySelectorAll(".star-btn").forEach(btn => {
      btn.onclick = () => {
        const val = parseInt(btn.dataset.val, 10);
        answers[qid] = val;
        group.querySelectorAll(".star-btn").forEach(b => {
          b.classList.toggle("filled", parseInt(b.dataset.val,10) <= val);
        });
        if (q.starLabels) {
          document.getElementById("starLabel-"+qid).textContent = q.starLabels[val-1];
        }
      };
    });
  });
  // choice
  document.querySelectorAll(".choice-list").forEach(group => {
    const qid = group.dataset.qid;
    group.querySelectorAll(".choice-opt").forEach(btn => {
      btn.onclick = () => {
        answers[qid] = btn.dataset.val;
        group.querySelectorAll(".choice-opt").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
      };
    });
  });
  // nps
  document.querySelectorAll(".nps-scale").forEach(group => {
    const qid = group.dataset.qid;
    group.querySelectorAll(".nps-btn").forEach(btn => {
      btn.onclick = () => {
        answers[qid] = parseInt(btn.dataset.val, 10);
        group.querySelectorAll(".nps-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
      };
    });
  });
  // text
  document.querySelectorAll('textarea[data-qid]').forEach(ta => {
    ta.oninput = () => { answers[ta.dataset.qid] = ta.value.trim(); };
  });

  document.getElementById("pvForm").onsubmit = async (e) => {
    e.preventDefault();
    const missing = POSVENDA_QUESTIONS.filter(q => q.required && (answers[q.id] === undefined || answers[q.id] === ""));
    if (missing.length) {
      alert("Por favor, responda: " + missing.map(q => q.text).join(" / "));
      return;
    }
    const btn = document.getElementById("btnPvSubmit");
    btn.disabled = true;
    btn.textContent = "Enviando...";
    try {
      await addDoc(collection(db, "posvenda_responses"), {
        answers,
        createdAt: serverTimestamp()
      });
      renderThanks(app, "#/pos-venda");
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Enviar respostas";
      alert("Não foi possível enviar. Verifique a conexão e tente de novo.");
    }
  };
  keepScreenAwake();
}

/* ======================================================================
   TELA DE AGRADECIMENTO + RETORNO AUTOMÁTICO (modo totem)
   ====================================================================== */
let returnTimerInterval = null;
function stopReturnTimer(){
  if (returnTimerInterval) { clearInterval(returnTimerInterval); returnTimerInterval = null; }
}
function renderThanks(app, backHash){
  stopReturnTimer();
  let secondsLeft = 15;
  app.innerHTML = `
    <div class="thanks-wrap">
      ${bgDecorHtml()}
      <div class="thanks-card">
        <div class="check-wrap">
          <svg viewBox="0 0 74 74">
            <circle class="check-circle" cx="37" cy="37" r="35"></circle>
            <path class="check-mark" d="M22,38 L32,48 L52,26"></path>
          </svg>
        </div>
        <h2>Obrigado pela sua avaliação!</h2>
        <p>Sua resposta foi registrada com sucesso. Isso nos ajuda a melhorar sempre.</p>
        <button class="btn secondary" id="btnVoltar" style="margin-top:24px;">Voltar para a avaliação</button>
        <div class="countdown" id="countdownTxt">Retornando em ${secondsLeft}s...</div>
      </div>
    </div>
  `;
  document.getElementById("btnVoltar").onclick = () => { stopReturnTimer(); navigate(backHash); render(); };
  returnTimerInterval = setInterval(() => {
    secondsLeft -= 1;
    const el = document.getElementById("countdownTxt");
    if (el) el.textContent = `Retornando em ${secondsLeft}s...`;
    if (secondsLeft <= 0) {
      stopReturnTimer();
      navigate(backHash);
      render();
    }
  }, 1000);
}

/* ======================================================================
   ADMIN — RESULTADOS
   ====================================================================== */
async function renderAdminResults(app, kind){
  app.innerHTML = topbarHtml(kind) + `<div class="admin-wrap"><div class="empty-state">Carregando respostas...</div></div>`;
  bindLogout();

  const colName = kind === "nps" ? "responses" : "posvenda_responses";
  let docs = [];
  try {
    const q = query(collection(db, colName), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
  } catch (err) {
    document.querySelector(".admin-wrap").innerHTML = `<div class="error-msg">Erro ao carregar dados: ${err.message}</div>`;
    return;
  }

  if (kind === "nps") { renderNpsResultsBody(docs); return; }
  renderPosVendaResultsBody(docs);
}

function renderNpsResultsBody(docs){
  const wrap = document.querySelector(".admin-wrap");
  const total = docs.length;
  const avg = total ? (docs.reduce((s,d)=>s+(d.score||0),0)/total).toFixed(2) : "0.00";
  const dist = [1,2,3,4,5].map(s => docs.filter(d => d.score === s).length);
  const promotores = docs.filter(d => d.score >= 4).length;
  const detratores = docs.filter(d => d.score <= 2).length;

  wrap.innerHTML = `
    <div class="grid-stats">
      <div class="stat-box"><div class="num">${total}</div><div class="label">Respostas</div></div>
      <div class="stat-box"><div class="num">${avg}</div><div class="label">Nota média</div></div>
      <div class="stat-box"><div class="num">${promotores}</div><div class="label">Satisfeitos (4-5)</div></div>
      <div class="stat-box"><div class="num">${detratores}</div><div class="label">Insatisfeitos (1-2)</div></div>
    </div>

    <div class="section-title">Distribuição das notas</div>
    <div class="card" style="margin-bottom:26px;">
      ${["😡 1 - Muito insatisfeito","😕 2 - Insatisfeito","😐 3 - Neutro","🙂 4 - Satisfeito","😍 5 - Muito satisfeito"].map((label,i) => {
        const count = dist[i];
        const pct = total ? Math.round((count/total)*100) : 0;
        return `
          <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;">
              <span>${label}</span><span style="color:var(--muted);">${count} (${pct}%)</span>
            </div>
            <div style="background:#F1EBD9;border-radius:999px;height:9px;overflow:hidden;">
              <div style="background:linear-gradient(90deg,var(--ink-2),var(--ink));height:100%;width:${pct}%;border-radius:999px;transition:width .5s ease;"></div>
            </div>
          </div>`;
      }).join("")}
    </div>

    <div class="section-title">Histórico de respostas</div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Data e hora</th><th>Nota</th><th>Observação</th></tr></thead>
        <tbody>
          ${docs.length === 0 ? `<tr><td colspan="3" style="text-align:center;color:var(--muted);">Nenhuma resposta ainda.</td></tr>` :
            docs.map(d => `
              <tr>
                <td>${fmtDate(d.createdAt)}</td>
                <td>${d.score ?? ""}</td>
                <td>${d.observation ? d.observation.replace(/</g,"&lt;") : "—"}</td>
              </tr>
            `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderPosVendaResultsBody(docs){
  const wrap = document.querySelector(".admin-wrap");
  const total = docs.length;

  function avgOf(qid){
    const vals = docs.map(d => d.answers && d.answers[qid]).filter(v => typeof v === "number");
    if (!vals.length) return "—";
    return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);
  }
  function distOf(qid, options){
    const vals = docs.map(d => d.answers && d.answers[qid]);
    return options.map(opt => vals.filter(v => v === opt).length);
  }

  const npsVals = docs.map(d => d.answers && d.answers.q6).filter(v => typeof v === "number");
  const promotores = npsVals.filter(v => v >= 9).length;
  const neutros = npsVals.filter(v => v >= 7 && v <= 8).length;
  const detratores = npsVals.filter(v => v <= 6).length;
  const npsScore = npsVals.length ? Math.round(((promotores-detratores)/npsVals.length)*100) : 0;

  let breakdownHtml = "";
  POSVENDA_QUESTIONS.forEach((q, idx) => {
    if (q.type === "stars") {
      breakdownHtml += `
        <div class="card" style="margin-bottom:14px;">
          <div style="font-weight:600;font-size:13.5px;margin-bottom:6px;">Q${idx+1} — ${q.text}</div>
          <div style="font-family:'Fraunces',serif;font-size:23px;font-weight:700;color:var(--ink);">${avgOf(q.id)} <span style="font-size:13px;color:var(--muted);font-weight:600;font-family:'Inter',sans-serif;">/ 5</span></div>
        </div>`;
    } else if (q.type === "choice") {
      const dist = distOf(q.id, q.options);
      breakdownHtml += `
        <div class="card" style="margin-bottom:14px;">
          <div style="font-weight:600;font-size:13.5px;margin-bottom:10px;">Q${idx+1} — ${q.text}</div>
          ${q.options.map((opt,i) => {
            const count = dist[i];
            const pct = total ? Math.round((count/total)*100) : 0;
            return `<div style="margin-bottom:9px;">
              <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>${opt}</span><span style="color:var(--muted);">${count} (${pct}%)</span></div>
              <div style="background:#F1EBD9;border-radius:999px;height:8px;overflow:hidden;"><div style="background:linear-gradient(90deg,var(--ink-2),var(--ink));height:100%;width:${pct}%;border-radius:999px;"></div></div>
            </div>`;
          }).join("")}
        </div>`;
    } else if (q.type === "nps") {
      breakdownHtml += `
        <div class="card" style="margin-bottom:14px;">
          <div style="font-weight:600;font-size:13.5px;margin-bottom:6px;">Q${idx+1} — ${q.text}</div>
          <div style="font-family:'Fraunces',serif;font-size:23px;font-weight:700;color:var(--ink);">NPS ${npsScore}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px;">Promotores ${promotores} · Neutros ${neutros} · Detratores ${detratores}</div>
        </div>`;
    }
  });

  wrap.innerHTML = `
    <div class="grid-stats">
      <div class="stat-box"><div class="num">${total}</div><div class="label">Respostas</div></div>
      <div class="stat-box"><div class="num">${npsScore}</div><div class="label">NPS geral</div></div>
      <div class="stat-box"><div class="num">${avgOf("q1")}</div><div class="label">Experiência (média)</div></div>
      <div class="stat-box"><div class="num">${avgOf("q4")}</div><div class="label">Produtos (média)</div></div>
    </div>

    <div class="section-title">Detalhamento por pergunta</div>
    ${breakdownHtml}

    <div class="section-title">Histórico de respostas</div>
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th>Data e hora</th><th>Q1★</th><th>Q2★</th><th>Q3</th><th>Q4★</th><th>Q5</th><th>Q6 (0-10)</th><th>Q7</th>
        </tr></thead>
        <tbody>
          ${docs.length === 0 ? `<tr><td colspan="8" style="text-align:center;color:var(--muted);">Nenhuma resposta ainda.</td></tr>` :
            docs.map(d => {
              const a = d.answers || {};
              return `<tr>
                <td>${fmtDate(d.createdAt)}</td>
                <td>${a.q1 ?? "—"}</td><td>${a.q2 ?? "—"}</td><td>${a.q3 ?? "—"}</td>
                <td>${a.q4 ?? "—"}</td><td>${a.q5 ?? "—"}</td><td>${a.q6 ?? "—"}</td>
                <td>${a.q7 ? a.q7.replace(/</g,"&lt;") : "—"}</td>
              </tr>`;
            }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/* ======================================================================
   ADMIN — EXPORTAR
   ====================================================================== */
function csvEscape(val){
  const s = (val === null || val === undefined) ? "" : String(val);
  if (/[;"\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function downloadCsv(filename, rows){
  const content = rows.map(r => r.map(csvEscape).join(";")).join("\n");
  const blob = new Blob(["﻿" + content], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadXlsx(filename, rows){
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Dados");
  XLSX.writeFile(wb, filename);
}

async function buildRows(tipo){
  const colName = tipo === "nps" ? "responses" : "posvenda_responses";
  const q = query(collection(db, colName), orderBy("createdAt", "desc"));
  const snap = await getDocs(q);
  const docs = [];
  snap.forEach(d => docs.push(d.data()));

  if (tipo === "nps") {
    const rows = [["Data","Hora","Nota","Classificação","Observação"]];
    docs.forEach(d => {
      const { data, hora } = splitDateTime(d.createdAt);
      let classif = "Neutro";
      if (d.score >= 4) classif = "Satisfeito";
      else if (d.score <= 2) classif = "Insatisfeito";
      rows.push([data, hora, d.score ?? "", classif, d.observation || ""]);
    });
    return rows;
  } else {
    const header = ["Data","Hora", ...POSVENDA_QUESTIONS.map((q,i) => `Q${i+1}: ${q.text}`)];
    const rows = [header];
    docs.forEach(d => {
      const { data, hora } = splitDateTime(d.createdAt);
      const a = d.answers || {};
      rows.push([data, hora, ...POSVENDA_QUESTIONS.map(q => a[q.id] ?? "")]);
    });
    return rows;
  }
}

function renderExportar(app){
  app.innerHTML = topbarHtml("exportar") + `
    <div class="admin-wrap">
      <div class="section-title">Exportar dados</div>
      <div class="card" style="max-width:460px;">
        <div class="field">
          <label>Tipo de pesquisa</label>
          <select id="expTipo">
            <option value="nps">Pesquisa NPS (simples)</option>
            <option value="posvenda">Pós-venda</option>
          </select>
        </div>
        <div style="display:flex;gap:10px;margin-top:20px;">
          <button class="btn gold" id="btnXlsx" style="flex:1;justify-content:center;">Exportar Excel (.xlsx)</button>
          <button class="btn secondary" id="btnCsv" style="flex:1;justify-content:center;">Exportar CSV</button>
        </div>
        <div id="expMsg" style="margin-top:12px;font-size:13px;color:var(--muted);"></div>
      </div>
    </div>
  `;
  bindLogout();

  async function handleExport(kind){
    const tipo = document.getElementById("expTipo").value;
    const msg = document.getElementById("expMsg");
    msg.textContent = "Gerando arquivo...";
    try {
      const rows = await buildRows(tipo);
      const base = `sensacao-${tipo}-${new Date().toISOString().slice(0,10)}`;
      if (kind === "xlsx") downloadXlsx(base + ".xlsx", rows);
      else downloadCsv(base + ".csv", rows);
      msg.textContent = `Arquivo gerado com ${rows.length - 1} resposta(s).`;
    } catch (err) {
      msg.textContent = "Erro ao gerar o arquivo: " + err.message;
    }
  }
  document.getElementById("btnXlsx").onclick = () => handleExport("xlsx");
  document.getElementById("btnCsv").onclick = () => handleExport("csv");
}

/* ======================================================================
   MODO TOTEM: manter tela acesa + reload diário silencioso
   ====================================================================== */
let wakeLock = null;
async function keepScreenAwake(){
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) { /* silencioso — nem todo navegador suporta */ }
}
document.addEventListener("visibilitychange", async () => {
  if (wakeLock !== null && document.visibilityState === "visible") {
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
});

let _dailyReloadDone = false;
setInterval(() => {
  const now = new Date();
  const h = getHash();
  const isPublicKiosk = h.startsWith("#/pesquisa") || h.startsWith("#/pos-venda") || h === "" || h === "#/";
  if (isPublicKiosk && now.getHours() === 4 && !_dailyReloadDone) {
    _dailyReloadDone = true;
    window.location.reload();
  }
  if (now.getHours() !== 4) _dailyReloadDone = false;
}, 60000);

/* ======================================================================
   MARCA D'ÁGUA: acompanha a rolagem com uma animação suave de deslizar
   ====================================================================== */
let wmTicking = false;
function updateWatermarkParallax(){
  wmTicking = false;
  const offset = Math.max(-8, Math.min(70, window.scrollY * 0.14));
  document.querySelectorAll(".logo-watermark").forEach(el => {
    const base = el.classList.contains("wm-mid") ? "-50%" : "0";
    el.style.transform = `translate(-50%, calc(${base} + ${offset}px)) rotate(-2deg)`;
  });
}
window.addEventListener("scroll", () => {
  if (!wmTicking) {
    wmTicking = true;
    requestAnimationFrame(updateWatermarkParallax);
  }
}, { passive:true });

/* ======================================================================
   INICIALIZAÇÃO
   ====================================================================== */
if (!window.location.hash) window.location.hash = "#/pesquisa";
render();
updateWatermarkParallax();
</script>
